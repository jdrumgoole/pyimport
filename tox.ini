[tox]
# Test against Python 3.9, 3.10, 3.11, 3.12, and 3.13
# Project supports Python 3.9+ (updated from ^3.10)
envlist = py39, py310, py311, py312, py313
skip_missing_interpreters = true

[testenv]
# Install package in editable mode to ensure tox virtualenv is used
deps =
    pytest
    pytest-asyncio
    pytest-xdist
    pytest-cov
    pymongo
    motor
    dnspython
    python-dateutil
    toml
    tqdm
    configargparse
    pytz
    py-dateinfer
    aiocsv
    aiofile
    aiofiles
    aiohttp
    asyncstdlib
    sqlalchemy
    psycopg2-binary
    psycopg
    requests
    mimesis
commands =
    # Run pytest directly in tox virtualenv (not through poetry)
    pytest test/test_args
    pytest test/test_command
    pytest test/test_config
    pytest test/test_e2e
    pytest test/test_fieldfile
    pytest test/test_file_processor
    pytest test/test_filesplitter
    pytest test/test_http_import
    pytest test/test_linecounter
    pytest test/test_linereader
    pytest test/test_mot
    pytest test/test_splitfile
    pytest test/test_general
    pytest test/test_formats
