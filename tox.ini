[tox]
# Test against Python 3.9, 3.10, 3.11, 3.12, and 3.13
# Project supports Python 3.9+ (updated from ^3.10)
envlist = py39, py310, py311, py312, py313
skip_missing_interpreters = true

[testenv]
# Allow shell commands to change directory before running pytest
allowlist_externals = sh
# Install package in editable mode to ensure tox virtualenv is used
deps =
    pytest
    pytest-asyncio
    pytest-xdist
    pytest-cov
    pymongo
    motor
    dnspython
    python-dateutil
    toml
    tqdm
    configargparse
    pytz
    py-dateinfer
    aiocsv
    aiofile
    aiofiles
    aiohttp
    asyncstdlib
    sqlalchemy
    psycopg2-binary
    psycopg
    requests
    mimesis
    python-dotenv
    colorama
commands =
    # Run pytest from within each test directory (tests expect to be run from their own directory)
    sh -c 'cd test/test_args && pytest'
    sh -c 'cd test/test_command && pytest'
    sh -c 'cd test/test_config && pytest'
    sh -c 'cd test/test_e2e && pytest'
    sh -c 'cd test/test_fieldfile && pytest'
    sh -c 'cd test/test_file_processor && pytest'
    sh -c 'cd test/test_filesplitter && pytest'
    sh -c 'cd test/test_http_import && pytest'
    sh -c 'cd test/test_linecounter && pytest'
    sh -c 'cd test/test_linereader && pytest'
    sh -c 'cd test/test_mot && pytest'
    sh -c 'cd test/test_splitfile && pytest'
    sh -c 'cd test/test_general && pytest'
    sh -c 'cd test/test_formats && pytest'
